name: Build docker image

on:
  push:
    branches:
    - master

    tags:
    - '*'
    - '!*-r[0-9]*'

env:
  REDIS86: '8.6.6'
  REDIS84: '8.4.6'
  REDIS82: '8.2.9'
  REDIS74: '7.4.11'

jobs:
  setup:
    runs-on: ubuntu-latest
    outputs:
      redis-versions: ${{ steps.set-matrix.outputs.redis-versions }}
    steps:
      - id: set-matrix
        run: |
          cat << 'EOF' > versions.json
          [
            {"key": "redis86", "version": "${{ env.REDIS86 }}", "latest": "1", "latest_major": "1"},
            {"key": "redis84", "version": "${{ env.REDIS84 }}", "latest": "", "latest_major": ""},
            {"key": "redis82", "version": "${{ env.REDIS82 }}", "latest": "", "latest_major": ""},
            {"key": "redis74", "version": "${{ env.REDIS74 }}", "latest": "", "latest_major": "1"}
          ]
          EOF
          echo "redis-versions=$(cat versions.json | jq -c .)" >> $GITHUB_OUTPUT

  build:
    needs: setup
    strategy:
      fail-fast: false
      matrix:
        redis: ${{ fromJson(needs.setup.outputs.redis-versions) }}
        arch:
          - amd64
          - arm64
        include:
          - arch: amd64
            runner: ubuntu-24.04
          - arch: arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v6
      - uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}
      - name: Build and test
        id: build-image
        env:
          REDIS_VER: ${{ matrix.redis.version }}
          ARCH: ${{ matrix.arch }}
        run: |
          make
          make test
          echo "image=$(make --no-print-directory -s image-ref)" >> "$GITHUB_OUTPUT"
      - name: Scan image
        if: github.event_name == 'push'
        uses: ./.github/actions/grype
        with:
          image: docker:${{ steps.build-image.outputs.image }}
      - name: Push scanned architecture image
        if: github.event_name == 'push'
        env:
          REDIS_VER: ${{ matrix.redis.version }}
          ARCH: ${{ matrix.arch }}
        run: make push

  push:
    runs-on: ubuntu-latest
    needs:
      - setup
      - build
    strategy:
      matrix:
        redis: ${{ fromJson(needs.setup.outputs.redis-versions) }}
    steps:
      - uses: actions/checkout@v6
      - uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}
      - uses: ./.github/actions
        with:
          version: ${{ matrix.redis.version }}
          latest: ${{ matrix.redis.latest }}
          latest_major: ${{ matrix.redis.latest_major }}

  image-revision-aliases:
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/r')
    needs: [ push ]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    concurrency:
      group: image-revision-aliases-${{ github.ref }}
      cancel-in-progress: false
    steps:
      - uses: wodby/images/.github/actions/image-revision-aliases@412e2d9ce29c41835ff653b0945bba72eabd9efb
        with:
          docker_username: ${{ secrets.DOCKER_USERNAME }}
          docker_password: ${{ secrets.DOCKER_PASSWORD }}
